    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d16"/><stop offset="100%" stop-color="#18203a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g opacity=".07" stroke="#f5f7fa" stroke-width="2">
    <path d="M0 256h1024M0 512h1024M0 768h1024M256 0v1024M512 0v1024M768 0v1024"/>
  </g>
  <!-- connectors -->
  <g fill="none" stroke="#9aa4bd" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 290 v86"/>
    <path d="M420 512 h-128 v124"/>
    <path d="M604 512 h128 v124"/>
  </g>
  <g fill="#9aa4bd">
