  <path d="M212 742 h160 M212 794 h104" stroke="#9aa4bd" stroke-width="20" stroke-linecap="round"/>
  <rect x="592" y="670" width="280" height="190" rx="28" fill="#141a2e" stroke="#2f3a5c" stroke-width="12"/>
  <path d="M652 742 h160 M652 794 h104" stroke="#9aa4bd" stroke-width="20" stroke-linecap="round"/>
</svg>
