  <path d="M452 220 h120" stroke="#f5f7fa" stroke-width="22" stroke-linecap="round"/>
  <!-- decision -->
  <path d="M512 410 L612 512 L512 614 L412 512 Z" fill="#ef4444"/>
  <!-- two outcome nodes -->
