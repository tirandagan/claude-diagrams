<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Diagrams">
  <!-- Source for the directory listing icon in .claude-plugin/. Re-render it at 1024x1024 if you change this. -->
